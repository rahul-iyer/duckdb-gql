<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="950" viewBox="0 0 1800 950">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1971c2"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b8a3e"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c36b5"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e67700"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/></marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2255c"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f5b"/></marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #1e1e1e; }
      .title { font-size: 34px; font-weight: 650; }
      .subtitle { font-size: 20px; fill: #495057; }
      .box-title { font-size: 20px; font-weight: 700; text-anchor: middle; }
      .box-line { font-size: 17px; text-anchor: middle; }
      .flow { fill: none; stroke-width: 3; }
    </style>
  </defs>
  <rect width="1800" height="950" fill="#ffffff"/>
  <text x="40" y="68" class="title">DuckDB-GQL compiler and execution architecture</text>
  <text x="42" y="112" class="subtitle">One semantic pipeline; native tables are truth; physical access paths compete under one cost model.</text>

  <rect x="40" y="160" width="220" height="130" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="3"/>
  <text x="150" y="195" class="box-title">GQL source</text>
  <text x="150" y="226" class="box-line">ISO grammar parse tree</text>
  <text x="150" y="253" class="box-line">Parser diagnostics</text>

  <rect x="340" y="160" width="240" height="130" rx="14" fill="#d0ebff" stroke="#1971c2" stroke-width="3"/>
  <text x="460" y="190" class="box-title">Ordered immutable AST</text>
  <text x="460" y="220" class="box-line">Clause + path variants</text>
  <text x="460" y="247" class="box-line">Nested query structure</text>
  <text x="460" y="274" class="box-line">Source spans</text>

  <rect x="660" y="160" width="240" height="130" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="3"/>
  <text x="780" y="190" class="box-title">Scoped typed binder</text>
  <text x="780" y="220" class="box-line">Symbols + graph focus</text>
  <text x="780" y="247" class="box-line">Overload resolution</text>
  <text x="780" y="274" class="box-line">Semantic validation</text>

  <rect x="980" y="160" width="240" height="130" rx="14" fill="#f3d9fa" stroke="#9c36b5" stroke-width="3"/>
  <text x="1100" y="190" class="box-title">Graph-relational IR</text>
  <text x="1100" y="220" class="box-line">Explicit Apply + Expand</text>
  <text x="1100" y="247" class="box-line">Path search + DML</text>
  <text x="1100" y="274" class="box-line">Typed schemas</text>

  <rect x="1300" y="160" width="280" height="130" rx="14" fill="#ffec99" stroke="#e67700" stroke-width="3"/>
  <text x="1440" y="190" class="box-title">Property-driven optimizer</text>
  <text x="1440" y="220" class="box-line">Graph rewrites + join order</text>
  <text x="1440" y="247" class="box-line">Statistics + cost model</text>
  <text x="1440" y="274" class="box-line">Physical access selection</text>

  <path d="M268 225 H332" class="flow" stroke="#1971c2" marker-end="url(#arrow-blue)"/>
  <path d="M588 225 H652" class="flow" stroke="#2b8a3e" marker-end="url(#arrow-green)"/>
  <path d="M908 225 H972" class="flow" stroke="#9c36b5" marker-end="url(#arrow-purple)"/>
  <path d="M1228 225 H1292" class="flow" stroke="#e67700" marker-end="url(#arrow-orange)"/>

  <rect x="40" y="430" width="760" height="450" rx="14" fill="#f8f9fa" stroke="#495057" stroke-width="3"/>
  <text x="75" y="475" font-size="23" font-weight="700">Non-negotiable contracts</text>
  <text x="75" y="522" font-size="20">• Clause order and query nesting survive parsing.</text>
  <text x="75" y="568" font-size="20">• Every symbol has an identity, scope and type.</text>
  <text x="75" y="614" font-size="20">• Optional MATCH is a correlated LeftApply—not a flag.</text>
  <text x="75" y="660" font-size="20">• Quantified paths stay one LogicalPathExpand—not plan explosion.</text>
  <text x="75" y="706" font-size="20">• Mutations are operators in one transaction plan—not sidecars.</text>
  <text x="75" y="752" font-size="20">• MVCC tables are authoritative; CSR is disposable.</text>
  <text x="75" y="798" font-size="20">• A verifier checks every compiler boundary.</text>

  <rect x="1020" y="450" width="280" height="140" rx="14" fill="#e9ecef" stroke="#495057" stroke-width="3"/>
  <text x="1160" y="483" class="box-title">DuckDB native plan</text>
  <text x="1160" y="514" class="box-line">Scan / join / filter</text>
  <text x="1160" y="541" class="box-line">Aggregate / sort / set ops</text>
  <text x="1160" y="568" class="box-line">Transactional DML</text>

  <rect x="1400" y="450" width="300" height="140" rx="14" fill="#ffdeeb" stroke="#c2255c" stroke-width="3"/>
  <text x="1550" y="483" class="box-title">Graph physical operators</text>
  <text x="1550" y="514" class="box-line">Adjacency join</text>
  <text x="1550" y="541" class="box-line">Recursive path engine</text>
  <text x="1550" y="568" class="box-line">Vectorized CSR traversal</text>

  <path d="M1385 298 L1160 442" class="flow" stroke="#495057" marker-end="url(#arrow-gray)"/>
  <path d="M1470 298 L1550 442" class="flow" stroke="#c2255c" marker-end="url(#arrow-pink)"/>

  <rect x="1020" y="740" width="280" height="140" rx="14" fill="#c3fae8" stroke="#087f5b" stroke-width="3"/>
  <text x="1160" y="773" class="box-title">Authoritative storage</text>
  <text x="1160" y="804" class="box-line">Native wide tables + MVCC</text>
  <text x="1160" y="831" class="box-line">Catalog graph bindings</text>
  <text x="1160" y="858" class="box-line">DuckDB indexes + stats</text>

  <rect x="1400" y="740" width="300" height="140" rx="14" fill="#e6fcf5" stroke="#087f5b" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="1550" y="773" class="box-title">Derived CSR cache</text>
  <text x="1550" y="804" class="box-line">Snapshot/version keyed</text>
  <text x="1550" y="831" class="box-line">Transaction delta overlay</text>
  <text x="1550" y="858" class="box-line">LRU + memory budget</text>

  <path d="M1160 598 V732" class="flow" stroke="#087f5b" marker-end="url(#arrow-teal)"/>
  <path d="M1470 598 L1280 732" class="flow" stroke="#087f5b" marker-end="url(#arrow-teal)"/>
  <path d="M1550 598 V732" class="flow" stroke="#087f5b" marker-end="url(#arrow-teal)"/>
  <path d="M1308 810 H1392" class="flow" stroke="#087f5b" stroke-dasharray="10 7" marker-end="url(#arrow-teal)"/>
</svg>
