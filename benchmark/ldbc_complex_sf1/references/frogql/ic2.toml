# LDBC SNB Interactive Complex Read 2 — Recent messages by your friends.
# Spec: https://github.com/ldbc/ldbc_snb_docs/blob/main/query-specifications/interactive-complex-read-02.yaml

id = 2
name = "Recent messages by your friends"
status = "implemented"

params_file = "interactive_2_param.txt"
param_columns = ["personId", "maxDate"]
param_types = ["int", "int"]

query = """
MATCH (:Person {id: {personId}})~[:knows]~(friend:Person)<-[:hasCreator]-(message:Comment|Post)
WHERE message.creationDate <= {maxDate}
RETURN
    friend.id AS personId,
    friend.firstName AS personFirstName,
    friend.lastName AS personLastName,
    message.id AS postOrCommentId,
    COALESCE(message.content, message.imageFile) AS postOrCommentContent,
    message.creationDate AS postOrCommentCreationDate
ORDER BY postOrCommentCreationDate DESC, postOrCommentId ASC
LIMIT 20
"""

return_columns = [
    "personId", "personFirstName", "personLastName",
    "postOrCommentId", "postOrCommentContent", "postOrCommentCreationDate",
]

[divergences]
message-union = "spec uses (message:Message); our LDBC loader doesn't synthesize a :Message superlabel, so we use the :Comment|Post ISO GQL alternation. Same logical query."
edge-casing = "spec uses :KNOWS, :HAS_CREATOR (uppercase). Our loader produces :knows, :hasCreator (filename-stem convention). Loader-level."
no-tointeger = "spec ORDER BY tie-break is `toInteger(postOrCommentId) ASC`. gqlite stores LDBC IDs as native int, so `postOrCommentId ASC` sorts identically. `toInteger()` isn't in the parser; not needed here."
